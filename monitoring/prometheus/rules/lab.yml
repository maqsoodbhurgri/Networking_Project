groups:
  - name: lab-detection
    rules:
      - alert: SuspiciousPacketRate
        expr: rate(node_network_receive_packets_total{device="eth0"}[10s]) > 50
        for: 0s
        labels:
          severity: warning
          method: A
        annotations:
          summary: "Untrusted zone packet rate above 50 pps (scan or flood)"
      - alert: FloodPacketRate
        expr: rate(node_network_receive_packets_total{device="eth0"}[10s]) > 5000
        for: 0s
        labels:
          severity: critical
          method: A
        annotations:
          summary: "Untrusted zone packet rate above 5000 pps (flood)"
