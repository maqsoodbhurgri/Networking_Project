flush ruleset

table inet filter {
  chain input {
    type filter hook input priority 0; policy drop;
    iif lo accept
    ct state established,related accept
    ip saddr 10.10.99.0/24 accept
    icmp type echo-request accept
  }

  chain forward {
    type filter hook forward priority 0; policy drop;
    ct state established,related accept

    # Untrusted -> DMZ web server
    ip saddr 10.10.30.0/24 ip daddr 10.10.20.20 tcp dport { 22, 80 } accept
    ip saddr 10.10.30.0/24 ip daddr 10.10.20.20 icmp type echo-request accept

    # LAN -> DMZ web server
    ip saddr 10.10.10.0/24 ip daddr 10.10.20.20 tcp dport { 22, 80, 5201 } accept
    ip saddr 10.10.10.0/24 ip daddr 10.10.20.20 udp dport 5201 accept
    ip saddr 10.10.10.0/24 ip daddr 10.10.20.20 icmp type echo-request accept

    # Management zone -> everywhere
    ip saddr 10.10.99.0/24 accept

    # Everything else is counted and dropped
    counter drop
  }

  chain output {
    type filter hook output priority 0; policy accept;
  }
}
