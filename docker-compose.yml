name: networking_project

networks:
  untrusted:
    ipam: { config: [ { subnet: 10.10.30.0/24, gateway: 10.10.30.254 } ] }
  lan:
    ipam: { config: [ { subnet: 10.10.10.0/24, gateway: 10.10.10.254 } ] }
  dmz:
    ipam: { config: [ { subnet: 10.10.20.0/24, gateway: 10.10.20.254 } ] }
  mgmt:
    ipam: { config: [ { subnet: 10.10.99.0/24, gateway: 10.10.99.254 } ] }

x-node: &node
  build: ./images/node
  image: netlab-node
  cap_add: [NET_ADMIN]

services:
  router:
    <<: *node
    container_name: router
    hostname: router
    sysctls: [ net.ipv4.ip_forward=1 ]
    networks:
      untrusted: { ipv4_address: 10.10.30.1 }
      lan:       { ipv4_address: 10.10.10.1 }
      dmz:       { ipv4_address: 10.10.20.1 }
      mgmt:      { ipv4_address: 10.10.99.1 }
    volumes:
      - ./router/nftables.conf:/etc/nftables.conf:ro
    command: sh -c "nft -f /etc/nftables.conf; sleep infinity"

  attacker:
    <<: *node
    container_name: attacker
    hostname: attacker
    networks: { untrusted: { ipv4_address: 10.10.30.10 } }
    command: sh -c "ip route replace default via 10.10.30.1 && sleep infinity"

  client1:
    <<: *node
    container_name: client1
    hostname: client1
    networks: { lan: { ipv4_address: 10.10.10.11 } }
    command: sh -c "ip route replace default via 10.10.10.1 && sleep infinity"

  client2:
    <<: *node
    container_name: client2
    hostname: client2
    networks: { lan: { ipv4_address: 10.10.10.12 } }
    command: sh -c "ip route replace default via 10.10.10.1 && sleep infinity"

  web:
    <<: *node
    container_name: web
    hostname: web
    networks: { dmz: { ipv4_address: 10.10.20.20 } }
    command: sh -c "ip route replace default via 10.10.20.1 && service ssh start && nginx -g 'daemon off;'"

  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    network_mode: "service:router"
    depends_on: [router]
    restart: unless-stopped

  suricata:
    image: jasonish/suricata:latest
    container_name: suricata
    network_mode: "service:router"
    depends_on: [router]
    cap_add: [NET_ADMIN, NET_RAW, SYS_NICE]
    command: -i ${UNTRUSTED_IF} -k none -S /etc/suricata/rules/local.rules
    volumes:
      - ./suricata/local.rules:/etc/suricata/rules/local.rules
      - ./logs/suricata:/var/log/suricata
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    networks: { mgmt: { ipv4_address: 10.10.99.10 } }
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prom_data:/prometheus
    ports: [ "9090:9090" ]
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    networks: { mgmt: { ipv4_address: 10.10.99.12 } }
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports: [ "9093:9093" ]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    networks: { mgmt: { ipv4_address: 10.10.99.11 } }
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports: [ "3000:3000" ]
    restart: unless-stopped

  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    networks: { mgmt: { ipv4_address: 10.10.99.13 } }
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.0.0
    container_name: promtail
    networks: { mgmt: { ipv4_address: 10.10.99.14 } }
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./monitoring/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - ./logs/suricata:/var/log/suricata:ro
    depends_on: [loki]
    restart: unless-stopped

volumes:
  prom_data:
  grafana_data:
  loki_data:
